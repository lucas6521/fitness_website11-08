<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健身訓練百科</title>
<style>
:root{--color-bg:#fff;--color-bg-alt:#F4F6F8;--color-text:#1A1D21;--color-text-muted:#5C6670;--color-primary:#14304D;--color-accent:#FF6B2C;--color-success:#2E9D6A;--color-warning:#D9822B;--color-border:#E1E5EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--color-bg:#11161C;--color-bg-alt:#1B232C;--color-text:#E8ECF0;--color-text-muted:#9AA6B2;--color-primary:#8DB8E8;--color-border:#2D3945}}
:root[data-theme="dark"]{--color-bg:#11161C;--color-bg-alt:#1B232C;--color-text:#E8ECF0;--color-text-muted:#9AA6B2;--color-primary:#8DB8E8;--color-border:#2D3945}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
a{color:var(--color-primary)}
h1,h2,h3{color:var(--color-primary);line-height:1.3;font-weight:700}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.page{padding-top:32px;padding-bottom:40px}
header{border-bottom:1px solid var(--color-border)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 20px;padding-top:12px;padding-bottom:12px}
.brand{font-weight:700;font-size:1.15rem;color:var(--color-primary);text-decoration:none}
nav a{margin-right:16px;text-decoration:none;color:var(--color-text);font-weight:600}
nav a:last-child{margin-right:0}
nav a:hover,nav a[aria-current]{color:var(--color-accent)}
.hero{background:var(--color-bg-alt);padding:48px 0}
.hero h1{font-size:2rem;margin:0 0 8px}
.muted{color:var(--color-text-muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{display:block;background:var(--color-bg-alt);border-radius:12px;padding:18px;text-decoration:none;color:var(--color-text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.18)}
.card h3{margin:0 0 6px}
.card p{margin:0}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-text-muted);margin:2px 4px 2px 0;text-decoration:none}
.callout{border-left:4px solid var(--color-success);background:var(--color-bg-alt);padding:12px 16px;border-radius:12px;margin:16px 0}
.callout--warning{border-color:var(--color-warning)}
.btn{display:inline-block;padding:10px 20px;border-radius:12px;font-weight:600;text-decoration:none;margin:12px 8px 0 0;border:2px solid var(--color-accent);color:var(--color-text)}
.btn--primary{background:var(--color-accent);color:#1A1D21}
.scroll{overflow-x:auto}
.table-compare{border-collapse:collapse;width:100%;min-width:640px}
.table-compare th,.table-compare td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--color-border);vertical-align:top}
.table-compare th{background:var(--color-bg-alt);color:var(--color-primary)}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
.filters input,.filters select{font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text)}
section{margin-top:28px}
h2{font-size:1.3rem;margin:0 0 8px}
footer{background:var(--color-bg-alt);padding:24px 0;font-size:.9rem;color:var(--color-text-muted)}
footer p{margin:4px 0}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="#home">健身訓練百科</a>
<nav><a href="#types">訓練種類</a><a href="#exercises">動作資料庫</a><a href="#guides">新手指南</a><a href="#about">關於</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap">
<p>本網站內容僅供一般教育與參考，不構成醫療建議。開始任何訓練前，若你有傷病、慢性疾病或健康疑慮，請先諮詢醫師或合格專業人員。</p>
<p>資料來源說明：內容為一般性教育整理，未引用特定研究數據；次數、組數、頻率皆為一般參考範圍，請依個人狀況調整。</p>
<p>最後更新日期：2026-11-08</p></div></footer>

const E=[
['barbell-squat','槓鈴深蹲','Barbell Back Squat','st,hy','股四頭肌,臀,核心','槓鈴,深蹲架','中階','槓鈴置於上背，雙腳與肩同寬|吸氣收緊核心，臀部向後坐下，膝蓋對準腳尖|下降至大腿約與地面平行|腳跟踩地站起，頂端臀部發力','下降前吸氣並維持核心張力，站起時吐氣|視線朝前，背部保持中立','膝蓋內夾→刻意將膝蓋朝腳尖方向推|腳跟離地→降低重量並加強腳踝活動度','徒手深蹲','暫停深蹲','重量深蹲請使用安全架，新手建議由合格教練指導。'],

['burpee','波比跳','Burpee','hi,ca,bw','全身','徒手','中階','站姿下蹲，雙手撐地|雙腳向後跳成伏地挺身姿勢|雙腳跳回雙手旁|站起並向上輕跳','以穩定節奏呼吸，不憋氣|落地時膝蓋微彎緩衝','落地過重→放慢速度，輕輕落地|腰部塌陷→收緊核心','不跳版本（改用走步）','加入伏地挺身','強度高，心肺或關節狀況不佳者請先諮詢專業人員。'],

const uniq=a=>[...new Set(a)];
const opts=(l,a)=>`<option value="">${l}</option>`+a.map(x=>`<option>${x}</option>`).join('');
function exercises(){return wrap(`<h1>動作資料庫</h1><div class="filters"><input id="q" type="search" placeholder="搜尋動作名稱"><select id="ft"><option value="">所有訓練種類</option>${T.map(t=>`<option value="${t.c}">${t.n}</option>`).join('')}</select><select id="fm">${opts('所有肌群',uniq(E.flatMap(x=>x.m)))}</select><select id="fe">${opts('所有器材',uniq(E.flatMap(x=>x.q)))}</select><select id="fd">${opts('所有難度',['入門','中階','進階'])}</select></div><div class="grid" id="list"></div>`)}
function filt(){const q=$('#q').value.trim().toLowerCase(),t=$('#ft').value,m=$('#fm').value,e=$('#fe').value,d=$('#fd').value;
const r=E.filter(x=>(!q||(x.n+x.en).toLowerCase().includes(q))&&(!t||x.t.includes(t))&&(!m||x.m.includes(m))&&(!e||x.q.includes(e))&&(!d||x.d===d));
$('#list').innerHTML=r.length?r.map(eCard).join(''):'<p>找不到符合條件的動作。</p>'}
function exPage(id){const x=E.find(e=>e.s===id);if(!x)return;
return wrap(`<h1>${x.n} <span class="muted">${x.en}</span></h1>`+sec('基本資料',`<p>所屬訓練種類：${x.t.map(c=>`<a class="tag" href="#t-${TM[c].s}">${TM[c].n}</a>`).join('')}</p><p>主要肌群：${tags(x.m)}</p><p>所需器材：${tags(x.q)}</p><p>難度：${tags([x.d])}</p>`)+sec('動作步驟','<ol>'+x.st.map(s=>'<li>'+s+'</li>').join('')+'</ol>')+sec('呼吸與姿勢重點',ul(x.br))+sec('常見錯誤',ul(x.mi.map(m=>{const p=m.split('→');return `<b>${p[0]}</b><br>如何修正：${p[1]}`})))+sec('變化版本',ul(['較簡單：'+x.ez,'較進階：'+x.hd]))+`<div class="callout callout--warning"><b>安全提醒：</b>${x.sf}</div>`+upd)}
function guides(){return wrap('<h1>新手指南</h1><div class="grid">'+G.map(gCard).join('')+'</div>')}
function guidePage(id){const g=G.find(x=>x.s===id);if(!g)return;return wrap(`<h1>${g.n}</h1>`+g.p.map(p=>'<p>'+p+'</p>').join('')+`<a class="btn btn--primary" href="${g.l}">${g.lt}</a>`+upd)}
function about(){return wrap('<h1>關於與免責聲明</h1>'+sec('網站目的','<p>以繁體中文（台灣用語）整理訓練種類與動作資訊，幫助初學者與中階訓練者認識、查詢並選擇適合自己的訓練方式。</p>')+sec('內容原則',ul(['安全與正確優先，寧可保守','不提供醫療診斷或療效宣稱','次數、組數、頻率皆為一般參考範圍']))+'<div class="callout callout--warning">本網站內容僅供一般教育與參考，不構成醫療建議。開始任何訓練前，若你有傷病、慢性疾病或健康疑慮，請先諮詢醫師或合格專業人員。</div>')}
function route(){const h=location.hash.slice(1)||'home';let v;
if(h.startsWith('t-'))v=typePage(h.slice(2));else if(h.startsWith('e-'))v=exPage(h.slice(2));else if(h.startsWith('g-'))v=guidePage(h.slice(2));else v=({home,types,exercises,guides,about}[h]||home)();
app.innerHTML=v||wrap('<h1>找不到頁面</h1><a href="#home">回首頁</a>');
if(h==='exercises'){document.querySelectorAll('.filters input,.filters select').forEach(e=>e.addEventListener('input',filt));filt()}
const s=({t:'types',e:'exercises',g:'guides',a:'about'})[h[0]]||'home';
document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+s));
scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
